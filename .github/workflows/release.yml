name: Выпуск версии

# Срабатывает, когда в main попадает новая версия пакета (меняется pkg/pkg_dharma_mcp.xml).
# Если релиз этой версии уже есть, ничего не делает. Вручную можно запустить сухой прогон.
on:
  push:
    branches: [main]
    paths: ['pkg/pkg_dharma_mcp.xml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Сухой прогон: собрать и показать, ничего не публикуя
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Собрать и выпустить
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' pkg/pkg_dharma_mcp.xml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Некорректная версия: $version"; exit 1; }
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            dev/release.sh
            exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Релиз v$version уже существует: публиковать нечего."
            exit 0
          fi
          dev/release.sh --publish
