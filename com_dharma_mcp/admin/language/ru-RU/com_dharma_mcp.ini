COM_DHARMA_MCP_SCOPE_SHOP_WRITE="Магазин: запись — статусы заказов, цены, остатки (shop:write)"
COM_DHARMA_MCP_SCOPE_CONTENT_READ="Материалы, меню, модули: чтение (content:read)"
COM_DHARMA_MCP_SCOPE_CONTENT_WRITE="Материалы, меню, модули: запись (content:write)"
COM_DHARMA_MCP_SCOPE_TEMPLATE_READ="Шаблон: чтение стилей и файлов (template:read)"
COM_DHARMA_MCP_SCOPE_TEMPLATE_WRITE="Шаблон: запись стилей и файлов (template:write)"
COM_DHARMA_MCP_SCOPE_SYSTEM_READ="Система: чтение настроек, расширений, базы (system:read)"
