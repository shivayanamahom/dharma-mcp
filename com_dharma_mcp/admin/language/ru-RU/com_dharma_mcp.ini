COM_DHARMA_MCP_CONFIG_GENERAL="Основные настройки"
COM_DHARMA_MCP_CONFIG_ENABLED="Включить MCP-сервер"
COM_DHARMA_MCP_CONFIG_ENABLED_DESC="Если выключено, все запросы к серверу получают ответ 503."
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS="Требовать HTTPS"
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS_DESC="Токены нельзя передавать по открытому каналу. Отключайте только для локальной проверки."
COM_DHARMA_MCP_CONFIG_SERVER_MODE="Режим работы сервера"
COM_DHARMA_MCP_CONFIG_SERVER_MODE_DESC="Только чтение — изменений нет. Черновики — создаётся только неопубликованное, «живые» изменения требуют подтверждения. Полный доступ — «живые» изменения без подтверждения, опасные (удаление, файлы, настройки) всегда с подтверждением."
COM_DHARMA_MCP_MODE_READ_ONLY="Только чтение"
COM_DHARMA_MCP_MODE_DRAFTS="Чтение и черновики (живые изменения — с подтверждением)"
COM_DHARMA_MCP_MODE_FULL_WRITE="Полный доступ на запись"
COM_DHARMA_MCP_CONFIG_PII_ENABLED="Разрешить выдачу персональных данных"
COM_DHARMA_MCP_CONFIG_PII_ENABLED_DESC="Если выключено, поля покупателей (имя, телефон, адрес, почта) заменяются на [REDACTED] даже при наличии области customers:pii."
COM_DHARMA_MCP_CONFIG_MASK_PII="Маскировать персональные данные"
COM_DHARMA_MCP_CONFIG_MASK_PII_DESC="Показывать частично: телефон 79 *** *** 12, почта i***@domain.ru, имя И*** П***."
COM_DHARMA_MCP_CONFIG_LOG_RETENTION="Срок хранения журнала (дней)"
COM_DHARMA_MCP_CONFIG_LOG_RETENTION_DESC="Записи старше указанного срока удаляются автоматически."
COM_DHARMA_MCP_CONFIG_RATE_LIMIT="Лимит запросов в минуту"
COM_DHARMA_MCP_CONFIG_RATE_LIMIT_DESC="Максимальное число запросов с одного токена в минуту."
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED="Разрешить вход через OAuth"
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED_DESC="Нужен для подключения Claude (десктоп, веб) и ChatGPT: они не принимают статический токен. Пользователь входит обычной формой Joomla и выбирает, что разрешить. Выключите, если используете только токены."
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION="Разрешить регистрацию клиентов"
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION_DESC="Клиенты MCP регистрируются сами (стандарт RFC 7591). Если выключить, подключить нового клиента через OAuth будет нельзя; уже выданные доступы продолжат работать."
COM_DHARMA_MCP_TOKEN_LAST_USED_ASC="Последнее использование (раньше)"
COM_DHARMA_MCP_TOKEN_LAST_USED_DESC="Последнее использование (позже)"
COM_DHARMA_MCP_LOG_DURATION_ASC="Время (быстрее)"
COM_DHARMA_MCP_LOG_DURATION_DESC="Время (медленнее)"
COM_DHARMA_MCP_LOG_STATUS_OK="Успешно"
COM_DHARMA_MCP_LOG_STATUS_ERROR="Ошибка"
COM_DHARMA_MCP_LOG_STATUS_CONFIRM="Ждёт подтверждения"

COM_DHARMA_MCP_MENU_CONNECT="Подключение"
COM_DHARMA_MCP_CONNECT_HOWTO="Как подключить"
COM_DHARMA_MCP_CONNECT_TITLE="Подключение ИИ-ассистента"
COM_DHARMA_MCP_CONNECT_STEP_URL="1. Адрес вашего MCP-сервера"
COM_DHARMA_MCP_CONNECT_URL_INTRO="Этот адрес вы вводите в программе ИИ-ассистента (в клиенте). Он одинаков для всех клиентов."
COM_DHARMA_MCP_CONNECT_CHECKS="Самопроверка"
COM_DHARMA_MCP_CHECK_MCP="Сервер отвечает по этому адресу"
COM_DHARMA_MCP_CHECK_MCP_404="Адрес не доходит до Joomla. Если сайт работает на nginx, добавьте правила из инструкции (docs/INSTALL.md, раздел «Особенности хостинга»). Пока можно использовать адрес вида …/index.php/mcp."
COM_DHARMA_MCP_CHECK_MCP_403="Сервер отказал (403). Проверьте, что сайт открыт по HTTPS, и настройку «Требовать HTTPS» в Компоненты → Dharma MCP → Настройки."
COM_DHARMA_MCP_CHECK_MCP_OTHER="Ответ не похож на ответ MCP-сервера. Проверьте, что включён системный плагин «Dharma MCP (адреса)» и что сервер не выключен в настройках."
COM_DHARMA_MCP_CHECK_UNREACHABLE="Сайт не смог обратиться сам к себе (бывает на хостингах). Это не обязательно ошибка: проверьте адрес с вашего компьютера командой из раздела 3."
COM_DHARMA_MCP_CHECK_OAUTH="Настройки OAuth доступны (для Claude Desktop, claude.ai, ChatGPT)"
COM_DHARMA_MCP_CHECK_OAUTH_HINT="Они нужны для подключения без токена. Если недоступны, подключайте клиентов по токену, а для OAuth включите системный плагин «Dharma MCP (адреса)» и добавьте правила веб-сервера из инструкции (для nginx)."
COM_DHARMA_MCP_CONNECT_STEP_TOKEN="2. Токен доступа"
COM_DHARMA_MCP_CONNECT_TOKEN_INTRO="Токен — это пароль для ассистента. Создайте его: выберите пользователя Joomla и минимально нужные области (для начала достаточно чтения). Сразу после сохранения Joomla один раз покажет токен: скопируйте его. Claude Desktop, claude.ai и ChatGPT токен не просят: они входят через вашу учётную запись Joomla."
COM_DHARMA_MCP_CONNECT_CREATE_TOKEN="Создать токен"
COM_DHARMA_MCP_CONNECT_ALL_TOKENS="Все токены"
COM_DHARMA_MCP_CONNECT_STEP_CLIENT="3. Подключите программу ассистента"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE="Claude Code (терминал): по токену"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE_DESC="Выполните команду в терминале, подставив свой токен вместо ВАШ_ТОКЕН."
COM_DHARMA_MCP_CONNECT_DESKTOP="Claude Desktop, claude.ai, ChatGPT: без токена"
COM_DHARMA_MCP_CONNECT_DESKTOP_DESC="В настройках программы найдите «Коннекторы» (Connectors), добавьте свой коннектор (custom connector) и вставьте адрес из шага 1. Откроется страница вашего сайта: войдите и нажмите «Разрешить». Нужны включённая настройка «Разрешить вход через OAuth» и успешная проверка OAuth выше. Названия кнопок в клиентах меняются, сверяйтесь с их справкой."
COM_DHARMA_MCP_CONNECT_JSON="Cursor и другие клиенты (файл настроек)"
COM_DHARMA_MCP_CONNECT_JSON_DESC="Добавьте в файл настроек MCP вашей программы (вместо ВАШ_ТОКЕН подставьте токен):"
COM_DHARMA_MCP_CONNECT_CURL="Проверка из терминала"
COM_DHARMA_MCP_CONNECT_CURL_DESC="Если токен и адрес верны, в ответе придёт список инструментов (по умолчанию 27)."
COM_DHARMA_MCP_CONNECT_STEP_USE="4. Что говорить ассистенту"
COM_DHARMA_MCP_CONNECT_USE_INTRO="Пишите своими словами. Например:"
COM_DHARMA_MCP_CONNECT_EXAMPLE_1="«Покажи последние заказы и что заканчивается на складе»"
COM_DHARMA_MCP_CONNECT_EXAMPLE_2="«Сделай страницу „Доставка“ черновиком с таким текстом…»"
COM_DHARMA_MCP_CONNECT_EXAMPLE_3="«Добавь в подвал баннер про скидку»"
COM_DHARMA_MCP_CONNECT_SAFETY="В режиме «Чтение и черновики» ассистент ничего не опубликует и не изменит без вашего подтверждения. Все его действия записываются в «Журнал вызовов»."
COM_DHARMA_MCP_RAW_TOKEN_WHERE="Куда его вставить:"
COM_DHARMA_MCP_RAW_TOKEN_SERVER="Адрес сервера"
COM_DHARMA_MCP_RAW_TOKEN_CLAUDE_CODE="Команда для Claude Code (токен уже подставлен)"
COM_DHARMA_MCP_RAW_TOKEN_MORE="Другие программы (Cursor и др.), проверка и подробная инструкция:"
