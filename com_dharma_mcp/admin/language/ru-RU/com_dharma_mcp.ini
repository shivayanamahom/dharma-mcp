COM_DHARMA_MCP="Dharma MCP"
COM_DHARMA_MCP_XML_DESCRIPTION="Подключает ИИ-ассистента (Claude, ChatGPT и другие) к сайту на Joomla: магазин, материалы, меню, модули, шаблон и настройки. Всё идёт через ваши права Joomla и записывается в журнал."
COM_DHARMA_MCP_MENU_TOKENS="Токены доступа"
COM_DHARMA_MCP_MENU_LOGS="Журнал вызовов"
COM_DHARMA_MCP_MENU_SETTINGS="Настройки"

COM_DHARMA_MCP_TOKENS_TITLE="Токены доступа MCP"
COM_DHARMA_MCP_TOKEN_NEW="Новый токен"
COM_DHARMA_MCP_TOKEN_EDIT="Редактирование токена"
COM_DHARMA_MCP_TOKEN_TITLE="Название токена"
COM_DHARMA_MCP_TOKEN_TITLE_DESC="Например: Claude Desktop, ChatGPT, скрипт отчётов."
COM_DHARMA_MCP_TOKEN_USER="Пользователь Joomla"
COM_DHARMA_MCP_TOKEN_USER_DESC="Все действия выполняются от имени этого пользователя и проверяются по его правам в Joomla. Токен не может больше, чем сам пользователь."
COM_DHARMA_MCP_TOKEN_PREFIX="Префикс"
COM_DHARMA_MCP_TOKEN_SCOPES="Области доступа"
COM_DHARMA_MCP_TOKEN_SCOPES_DESC="Что разрешено этому токену. Выдавайте минимум: чтение — для отчётов, запись — только доверенным ассистентам. Области «Шаблон» и «Система» нужны разработчику."
COM_DHARMA_MCP_TOKEN_EXPIRES="Срок действия"
COM_DHARMA_MCP_TOKEN_EXPIRES_DESC="Оставьте пустым, если токен должен действовать бессрочно. Для областей «Шаблон» и «Система» лучше задать короткий срок."
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS="Разрешённые IP-адреса"
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS_DESC="Необязательно. Адреса или сети (например, 10.0.0.0/8) через запятую или с новой строки. Если пусто, токен работает с любого адреса. У облачных программ (Claude, ChatGPT) адрес заранее неизвестен, для них это поле лучше не заполнять."
COM_DHARMA_MCP_TOKEN_LAST_USED="Последнее использование"
COM_DHARMA_MCP_TOKEN_REQUESTS="Запросов"
COM_DHARMA_MCP_RAW_TOKEN_NOTICE="Сохраните токен сейчас: позже он не будет показан. Вставьте его в программу ассистента:"
COM_DHARMA_MCP_TOKEN_COPIED="Токен скопирован в буфер обмена"

COM_DHARMA_MCP_SCOPE_SHOP_READ="Магазин: чтение товаров, заказов, остатков и настроек (shop:read)"
COM_DHARMA_MCP_SCOPE_SHOP_WRITE="Магазин: запись — заказы, товары, цены, остатки, категории, акции, доставка, оплата и другие справочники (shop:write)"
COM_DHARMA_MCP_SCOPE_CONTENT_READ="Материалы, меню и модули: чтение (content:read)"
COM_DHARMA_MCP_SCOPE_CONTENT_WRITE="Материалы, меню и модули: запись (content:write)"
COM_DHARMA_MCP_SCOPE_TEMPLATE_READ="Шаблон: чтение стилей и файлов (template:read)"
COM_DHARMA_MCP_SCOPE_TEMPLATE_WRITE="Шаблон: запись стилей и файлов (template:write)"
COM_DHARMA_MCP_SCOPE_SYSTEM_READ="Система: чтение настроек, расширений и базы данных (system:read)"
COM_DHARMA_MCP_SCOPE_SYSTEM_WRITE="Система: изменение настроек и расширений (system:write)"
COM_DHARMA_MCP_SCOPE_CUSTOMERS_PII="Персональные данные покупателей (customers:pii)"

