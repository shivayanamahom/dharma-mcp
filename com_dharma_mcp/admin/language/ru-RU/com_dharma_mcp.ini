COM_DHARMA_MCP_LOG_STATUS="Статус"
COM_DHARMA_MCP_LOG_DURATION="Время (мс)"
COM_DHARMA_MCP_LOG_IP="IP-адрес"
COM_DHARMA_MCP_LOG_ARGUMENTS="Параметры"
COM_DHARMA_MCP_LOG_ERROR="Ошибка"

COM_DHARMA_MCP_CONFIG_GENERAL="Основные настройки"
COM_DHARMA_MCP_CONFIG_ENABLED="Включить MCP-сервер"
COM_DHARMA_MCP_CONFIG_ENABLED_DESC="Если выключить, сервер на любой запрос отвечает, что он отключён."
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS="Требовать HTTPS"
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS_DESC="Токены нельзя передавать по незащищённому соединению. Отключайте только для проверки на своём компьютере."
COM_DHARMA_MCP_CONFIG_SERVER_MODE="Режим работы сервера"
COM_DHARMA_MCP_CONFIG_SERVER_MODE_DESC="Только чтение — ничего не меняется. Чтение и черновики — новое создаётся неопубликованным, а изменения того, что уже видят посетители, ассистент делает только после вашего подтверждения. Полный доступ — такие изменения выполняются без подтверждения, но опасные (удаление, файлы, настройки) всегда требуют подтверждения."
COM_DHARMA_MCP_MODE_READ_ONLY="Только чтение"
COM_DHARMA_MCP_MODE_DRAFTS="Чтение и черновики (живые изменения — с подтверждением)"
COM_DHARMA_MCP_MODE_FULL_WRITE="Полный доступ на запись"
COM_DHARMA_MCP_CONFIG_PII_ENABLED="Разрешить выдачу персональных данных"
COM_DHARMA_MCP_CONFIG_PII_ENABLED_DESC="Если выключить, данные покупателей (имя, телефон, адрес, почта) в ответах скрываются, даже если у токена есть область customers:pii."
COM_DHARMA_MCP_CONFIG_MASK_PII="Маскировать персональные данные"
COM_DHARMA_MCP_CONFIG_MASK_PII_DESC="Показывать данные частично: телефон 79 *** *** 12, почта i***@domain.ru, имя И*** П***."
COM_DHARMA_MCP_CONFIG_LOG_RETENTION="Срок хранения журнала (дней)"
COM_DHARMA_MCP_CONFIG_LOG_RETENTION_DESC="Записи старше этого срока удаляются автоматически."
COM_DHARMA_MCP_CONFIG_RATE_LIMIT="Лимит запросов в минуту"
COM_DHARMA_MCP_CONFIG_RATE_LIMIT_DESC="Сколько запросов в минуту допускается с одного токена."
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED="Разрешить вход через сайт (OAuth)"
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED_DESC="Нужно для Claude Desktop, claude.ai и ChatGPT: они не принимают готовый токен, а предлагают войти на вашем сайте. Пользователь входит обычной формой Joomla и выбирает, что разрешить. Выключите, если используете только токены."
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION="Разрешить программам регистрироваться самим"
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION_DESC="Программы-ассистенты сами регистрируются на сайте при первом подключении. Если выключить, подключить новую программу через вход будет нельзя; уже выданные доступы продолжат работать."
COM_DHARMA_MCP_TOKEN_LAST_USED_ASC="Последнее использование (раньше)"
COM_DHARMA_MCP_TOKEN_LAST_USED_DESC="Последнее использование (позже)"
COM_DHARMA_MCP_LOG_DURATION_ASC="Время (быстрее)"
COM_DHARMA_MCP_LOG_DURATION_DESC="Время (медленнее)"
COM_DHARMA_MCP_LOG_STATUS_OK="Успешно"
COM_DHARMA_MCP_LOG_STATUS_ERROR="Ошибка"
COM_DHARMA_MCP_LOG_STATUS_CONFIRM="Ждёт подтверждения"

COM_DHARMA_MCP_MENU_CONNECT="Подключение"
COM_DHARMA_MCP_CONNECT_HOWTO="Как подключить"
COM_DHARMA_MCP_CONNECT_TITLE="Подключение ИИ-ассистента"
COM_DHARMA_MCP_CONNECT_STEP_URL="1. Адрес вашего MCP-сервера"
COM_DHARMA_MCP_CONNECT_URL_INTRO="Этот адрес нужно ввести в программе ИИ-ассистента. Он один и тот же для всех программ."
COM_DHARMA_MCP_CONNECT_CHECKS="Самопроверка"
COM_DHARMA_MCP_CHECK_MCP="Сервер отвечает по этому адресу"
COM_DHARMA_MCP_CHECK_MCP_404="Адрес не доходит до Joomla. Если сайт работает на nginx, добавьте правила из инструкции (docs/INSTALL.md, раздел «Особенности хостинга»). Пока можно использовать адрес вида …/index.php/mcp."
COM_DHARMA_MCP_CHECK_MCP_403="Сервер отказал (ошибка 403). Проверьте, что сайт открывается по HTTPS, и настройку «Требовать HTTPS» (Компоненты → Dharma MCP → Настройки)."
COM_DHARMA_MCP_CHECK_MCP_OTHER="Ответ не похож на ответ MCP-сервера. Проверьте, что включён системный плагин «Система — Dharma MCP (адреса)» и что сервер не выключен в настройках."
COM_DHARMA_MCP_CHECK_UNREACHABLE="Сайт не смог обратиться сам к себе (так бывает на хостингах). Это не обязательно ошибка: проверьте адрес со своего компьютера командой из шага 3."
COM_DHARMA_MCP_CHECK_OAUTH="Вход через сайт доступен (нужен для Claude Desktop, claude.ai и ChatGPT)"
COM_DHARMA_MCP_CHECK_OAUTH_HINT="Он нужен для подключения без токена. Если проверка не прошла, подключайте программы по токену. Чтобы вход заработал, включите системный плагин «Система — Dharma MCP (адреса)» и, если сайт на nginx, добавьте правила из инструкции."
COM_DHARMA_MCP_CONNECT_STEP_TOKEN="2. Токен доступа"
COM_DHARMA_MCP_CONNECT_TOKEN_INTRO="Токен — это пароль для ассистента. Создайте его: выберите пользователя Joomla и самые необходимые области (для начала хватит чтения). Сразу после сохранения Joomla один раз покажет токен — скопируйте его. Claude Desktop, claude.ai и ChatGPT токен не просят: они входят через вашу учётную запись Joomla."
COM_DHARMA_MCP_CONNECT_CREATE_TOKEN="Создать токен"
COM_DHARMA_MCP_CONNECT_ALL_TOKENS="Все токены"
COM_DHARMA_MCP_CONNECT_STEP_CLIENT="3. Подключите программу ассистента"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE="Claude Code (терминал): по токену"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE_DESC="Выполните команду в терминале, заменив ВАШ_ТОКЕН своим токеном."
COM_DHARMA_MCP_CONNECT_DESKTOP="Claude Desktop, claude.ai, ChatGPT: без токена"
COM_DHARMA_MCP_CONNECT_DESKTOP_DESC="В настройках программы найдите «Коннекторы» (Connectors), добавьте свой коннектор (custom connector) и вставьте адрес из шага 1. Откроется страница вашего сайта: войдите и нажмите «Разрешить». Для этого должна быть включена настройка «Разрешить вход через сайт (OAuth)» и пройдена проверка выше. Названия кнопок в программах меняются — сверяйтесь с их справкой."
COM_DHARMA_MCP_CONNECT_JSON="Cursor и другие клиенты (файл настроек)"
COM_DHARMA_MCP_CONNECT_JSON_DESC="Добавьте это в файл настроек MCP вашей программы (замените ВАШ_ТОКЕН своим токеном):"
COM_DHARMA_MCP_CONNECT_CURL="Проверка из терминала"
COM_DHARMA_MCP_CONNECT_CURL_DESC="Если токен и адрес верны, в ответ придёт список инструментов."
COM_DHARMA_MCP_CONNECT_STEP_USE="4. Что говорить ассистенту"
COM_DHARMA_MCP_CONNECT_USE_INTRO="Пишите своими словами. Например:"
COM_DHARMA_MCP_CONNECT_EXAMPLE_1="«Покажи последние заказы и что заканчивается на складе»"
COM_DHARMA_MCP_CONNECT_EXAMPLE_2="«Сделай страницу „Доставка“ черновиком с таким текстом…»"
COM_DHARMA_MCP_CONNECT_EXAMPLE_3="«Добавь новый товар в категорию „Чай“ и поставь цену 450 рублей»"
COM_DHARMA_MCP_CONNECT_SAFETY="В режиме «Чтение и черновики» ассистент ничего не публикует и не меняет без вашего подтверждения. Все его действия записываются в «Журнал вызовов»."
COM_DHARMA_MCP_RAW_TOKEN_WHERE="Куда его вставить:"
COM_DHARMA_MCP_RAW_TOKEN_SERVER="Адрес сервера"
COM_DHARMA_MCP_RAW_TOKEN_CLAUDE_CODE="Команда для Claude Code (токен уже подставлен)"
COM_DHARMA_MCP_RAW_TOKEN_MORE="Другие программы (Cursor и др.), проверка и подробная инструкция:"
COM_DHARMA_MCP_CONNECT_EXAMPLE_4="«Создай промокод на скидку 10 % и самовывоз со склада на Ленина»"
COM_DHARMA_MCP_YOUR_TOKEN="ВАШ_ТОКЕН"
COM_DHARMA_MCP_LOGS_DELETE_SELECTED="Удалить выбранные"
COM_DHARMA_MCP_LOGS_DELETE_CONFIRM="Удалить отмеченные записи журнала? Это нельзя отменить."
COM_DHARMA_MCP_LOGS_CLEAR="Очистить весь журнал"
COM_DHARMA_MCP_LOGS_CLEAR_CONFIRM="Удалить ВСЕ записи журнала вызовов? Это нельзя отменить."
COM_DHARMA_MCP_LOGS_DELETED="Удалено записей журнала: %d."
COM_DHARMA_MCP_CONFIGURATION="Настройки Dharma MCP"
COM_DHARMA_MCP_CHECK_BOTS="Хостинг не блокирует запросы Claude и ChatGPT"
COM_DHARMA_MCP_CHECK_BOTS_HINT="Веб-сервер отвечает ошибкой 403 на запросы, которые подписаны как %s (защита от ИИ-ботов). Из-за этого вход проходит, а подключение сразу после него обрывается. Разрешите такие запросы хотя бы для адреса сервера: см. docs/INSTALL.md, раздел «Защита от ИИ-ботов»."
