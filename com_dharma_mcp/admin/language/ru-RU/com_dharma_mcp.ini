COM_DHARMA_MCP_TOKEN_EDIT="Редактирование токена"
COM_DHARMA_MCP_TOKEN_TITLE="Название токена"
COM_DHARMA_MCP_TOKEN_TITLE_DESC="Например: Claude Desktop, ChatGPT, скрипт отчётов."
COM_DHARMA_MCP_TOKEN_USER="Пользователь Joomla"
COM_DHARMA_MCP_TOKEN_USER_DESC="Все действия выполняются от имени этого пользователя и проверяются по его правам Joomla. Токен не может больше, чем сам пользователь."
COM_DHARMA_MCP_TOKEN_PREFIX="Префикс"
COM_DHARMA_MCP_TOKEN_SCOPES="Области доступа"
COM_DHARMA_MCP_TOKEN_SCOPES_DESC="Что разрешено этому токену. Выдавайте минимум: чтение — для отчётов, запись — только доверенным ассистентам. Области «шаблон» и «система» — для разработчика."
COM_DHARMA_MCP_TOKEN_EXPIRES="Срок действия"
COM_DHARMA_MCP_TOKEN_EXPIRES_DESC="Оставьте пустым для бессрочного токена. Для областей «шаблон» и «система» лучше ставить короткий срок."
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS="Разрешённые IP-адреса"
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS_DESC="Необязательно. Адреса или сети (10.0.0.0/8) через запятую или с новой строки. Пусто — с любого адреса. Для облачных клиентов (Claude, ChatGPT) адрес заранее неизвестен."
COM_DHARMA_MCP_TOKEN_LAST_USED="Последнее использование"
COM_DHARMA_MCP_TOKEN_REQUESTS="Запросов"
COM_DHARMA_MCP_RAW_TOKEN_NOTICE="Сохраните токен сейчас: больше он не будет показан. Добавьте его в клиент как Bearer-токен:"
COM_DHARMA_MCP_TOKEN_COPIED="Токен скопирован в буфер обмена"

