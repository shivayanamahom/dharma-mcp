COM_DHARMA_MCP_CONFIG_GENERAL="General"
COM_DHARMA_MCP_CONFIG_ENABLED="Enable the MCP server"
COM_DHARMA_MCP_CONFIG_ENABLED_DESC="When off, the server answers every request that it is switched off."
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS="Require HTTPS"
COM_DHARMA_MCP_CONFIG_REQUIRE_HTTPS_DESC="Tokens must not travel over an unprotected connection. Turn this off only for testing on your own computer."
COM_DHARMA_MCP_CONFIG_SERVER_MODE="Server mode"
COM_DHARMA_MCP_CONFIG_SERVER_MODE_DESC="Read only: nothing is changed. Read and drafts: new items are created unpublished, and changes to what visitors already see are made only after your confirmation. Full access: such changes are made without confirmation, but dangerous ones (deleting, files, settings) always need confirmation."
COM_DHARMA_MCP_MODE_READ_ONLY="Read only"
COM_DHARMA_MCP_MODE_DRAFTS="Read and drafts (live changes need confirmation)"
COM_DHARMA_MCP_MODE_FULL_WRITE="Full write access"
COM_DHARMA_MCP_CONFIG_PII_ENABLED="Allow personal data in answers"
COM_DHARMA_MCP_CONFIG_PII_ENABLED_DESC="When off, customer data (name, phone, address, email) is hidden in answers even if the token has the customers:pii area."
COM_DHARMA_MCP_CONFIG_MASK_PII="Mask personal data"
COM_DHARMA_MCP_CONFIG_MASK_PII_DESC="Show partially: phone 79 *** *** 12, email i***@domain.com, name J*** D***."
COM_DHARMA_MCP_CONFIG_LOG_RETENTION="Log retention (days)"
COM_DHARMA_MCP_CONFIG_LOG_RETENTION_DESC="Records older than this are deleted automatically. Default is 30 days."
COM_DHARMA_MCP_CONFIG_RATE_LIMIT="Requests per minute"
COM_DHARMA_MCP_CONFIG_RATE_LIMIT_DESC="How many requests per minute one token may make."
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED="Allow sign-in through the site (OAuth)"
COM_DHARMA_MCP_CONFIG_OAUTH_ENABLED_DESC="Needed for Claude Desktop, claude.ai and ChatGPT: they do not accept a ready-made token but ask you to sign in on your site. The user signs in with the normal Joomla form and chooses what to allow. Turn off if you only use tokens."
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION="Let applications register themselves"
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION_DESC="Assistant applications register themselves on the site when they connect for the first time. When off, no new application can connect through sign-in; existing access keeps working."
COM_DHARMA_MCP_TOKEN_LAST_USED_ASC="Last used (oldest)"
COM_DHARMA_MCP_TOKEN_LAST_USED_DESC="Last used (newest)"
COM_DHARMA_MCP_LOG_DURATION_ASC="Time (fastest)"
COM_DHARMA_MCP_LOG_DURATION_DESC="Time (slowest)"
COM_DHARMA_MCP_LOG_STATUS_OK="OK"
