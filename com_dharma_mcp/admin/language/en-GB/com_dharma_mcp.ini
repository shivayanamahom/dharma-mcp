COM_DHARMA_MCP_LOG_STATUS_CONFIRM="Awaiting confirmation"

COM_DHARMA_MCP_MENU_CONNECT="Connect"
COM_DHARMA_MCP_CONNECT_HOWTO="How to connect"
COM_DHARMA_MCP_CONNECT_TITLE="Connect an AI assistant"
COM_DHARMA_MCP_CONNECT_STEP_URL="1. The address of your MCP server"
COM_DHARMA_MCP_CONNECT_URL_INTRO="Enter this address in your AI assistant application. It is the same for every application."
COM_DHARMA_MCP_CONNECT_CHECKS="Self-check"
COM_DHARMA_MCP_CHECK_MCP="The server answers at this address"
COM_DHARMA_MCP_CHECK_MCP_404="The address does not reach Joomla. If the site runs on nginx, add the rules from the guide (docs/INSTALL.md, section on hosting). Meanwhile you can use an address like …/index.php/mcp."
COM_DHARMA_MCP_CHECK_MCP_403="The server refused (error 403). Check that the site opens over HTTPS, and the Require HTTPS setting (Components → Dharma MCP → Settings)."
COM_DHARMA_MCP_CHECK_MCP_OTHER="The answer does not look like an MCP server. Check that the system plugin “System - Dharma MCP (addresses)” is enabled and the server is not switched off in the settings."
COM_DHARMA_MCP_CHECK_UNREACHABLE="The site could not call itself (this happens on some hosting). It is not necessarily an error: test the address from your computer with the command in step 3."
COM_DHARMA_MCP_CHECK_OAUTH="Sign-in through the site is available (needed for Claude Desktop, claude.ai and ChatGPT)"
COM_DHARMA_MCP_CHECK_OAUTH_HINT="It is needed to connect without a token. If the check failed, connect applications with a token. To make sign-in work, enable the system plugin “System - Dharma MCP (addresses)” and, if the site runs on nginx, add the rules from the guide."
COM_DHARMA_MCP_CONNECT_STEP_TOKEN="2. Access token"
COM_DHARMA_MCP_CONNECT_TOKEN_INTRO="A token is a password for the assistant. Create one: choose a Joomla user and only the areas that are really needed (reading is enough at first). Right after saving, Joomla shows the token once — copy it. Claude Desktop, claude.ai and ChatGPT do not ask for a token: they sign in with your Joomla account."
COM_DHARMA_MCP_CONNECT_CREATE_TOKEN="Create a token"
COM_DHARMA_MCP_CONNECT_ALL_TOKENS="All tokens"
COM_DHARMA_MCP_CONNECT_STEP_CLIENT="3. Connect the assistant application"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE="Claude Code (terminal): with a token"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE_DESC="Run the command in a terminal, replacing YOUR_TOKEN with your token."
COM_DHARMA_MCP_CONNECT_DESKTOP="Claude Desktop, claude.ai, ChatGPT: without a token"
COM_DHARMA_MCP_CONNECT_DESKTOP_DESC="In the application settings find Connectors, add a custom connector and paste the address from step 1. A page of your site opens: sign in and press Allow. This needs the setting “Allow sign-in through the site (OAuth)” and a passing check above. Button names change between applications — see their help."
COM_DHARMA_MCP_CONNECT_JSON="Cursor and other clients (settings file)"
COM_DHARMA_MCP_CONNECT_JSON_DESC="Add this to the MCP settings file of your application (replace YOUR_TOKEN with your token):"
COM_DHARMA_MCP_CONNECT_CURL="Check from a terminal"
COM_DHARMA_MCP_CONNECT_CURL_DESC="If the token and address are correct, the answer is the list of tools."
COM_DHARMA_MCP_CONNECT_STEP_USE="4. What to tell the assistant"
COM_DHARMA_MCP_CONNECT_USE_INTRO="Write in your own words. For example:"
COM_DHARMA_MCP_CONNECT_EXAMPLE_1="“Show the latest orders and what is running out of stock”"
COM_DHARMA_MCP_CONNECT_EXAMPLE_2="“Make a Delivery page as a draft with this text…”"
COM_DHARMA_MCP_CONNECT_EXAMPLE_3="“Add a new product to the Tea category with a price of 450”"
COM_DHARMA_MCP_CONNECT_SAFETY="In the Read and drafts mode the assistant does not publish or change anything without your confirmation. Every action is written to the Call log."
COM_DHARMA_MCP_RAW_TOKEN_WHERE="Where to put it:"
COM_DHARMA_MCP_RAW_TOKEN_SERVER="Server address"
COM_DHARMA_MCP_RAW_TOKEN_CLAUDE_CODE="Command for Claude Code (the token is already filled in)"
COM_DHARMA_MCP_RAW_TOKEN_MORE="Other applications (Cursor etc.), testing and the full guide:"
COM_DHARMA_MCP_CONNECT_EXAMPLE_4="“Create a 10 % promo code and pickup from the Lenin Street warehouse”"
