COM_DHARMA_MCP_LOGS_DELETE_SELECTED="Delete selected"
COM_DHARMA_MCP_LOGS_DELETE_CONFIRM="Delete the selected log records? This cannot be undone."
COM_DHARMA_MCP_LOGS_CLEAR="Clear the whole log"
COM_DHARMA_MCP_LOGS_CLEAR_CONFIRM="Delete ALL call log records? This cannot be undone."
COM_DHARMA_MCP_LOGS_DELETED="%d log records deleted."
COM_DHARMA_MCP_CONFIGURATION="Dharma MCP settings"
COM_DHARMA_MCP_CHECK_BOTS="The hosting does not block requests from Claude and ChatGPT"
COM_DHARMA_MCP_CHECK_BOTS_HINT="The web server answers 403 to requests signed as %s (AI bot protection). Sign-in then succeeds, but the connection breaks right after it. Allow such requests at least for the server address: see docs/INSTALL.md, section “AI bot protection”."
COM_DHARMA_MCP_CONFIG_LOG_MAX_ROWS="Maximum log records"
COM_DHARMA_MCP_CONFIG_LOG_MAX_ROWS_DESC="When there are more records, the oldest are deleted even if the retention period has not passed. This keeps the log from growing with many calls. Long values (files, images, big texts) are shortened in the log."
COM_DHARMA_MCP_TOKEN_REGENERATE="Regenerate"
COM_DHARMA_MCP_TOKEN_REGENERATE_CONFIRM="Regenerate this token? The old value stops working immediately: wherever it is configured (Claude Code, Cursor and so on) the new value has to be pasted. The title, user, scopes, expiry and IP restrictions are kept."
COM_DHARMA_MCP_TOKEN_REGENERATED="Token regenerated: the old value no longer works. The new value is shown below."
COM_DHARMA_MCP_TOKEN_REGENERATE_ONE="Select exactly one token to regenerate."
COM_DHARMA_MCP_TOKEN_REGENERATE_OAUTH="A token issued to an app through OAuth (Claude, ChatGPT) cannot be regenerated. Disable it: the app gets new access the next time it signs in."
COM_DHARMA_MCP_TOKEN_NOT_FOUND="Token not found."
COM_DHARMA_MCP_TOKEN_LOST_HINT="The token value is shown only once, when it is created, and is not stored anywhere: the site keeps only its hash. If the token is lost, press Regenerate: the title, user, scopes, expiry and IP restrictions are kept and the old value stops working."

