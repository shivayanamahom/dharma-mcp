COM_DHARMA_MCP_CONNECT_HOWTO="How to connect"
COM_DHARMA_MCP_CONNECT_TITLE="Connect an AI assistant"
COM_DHARMA_MCP_CONNECT_STEP_URL="1. The address of your MCP server"
COM_DHARMA_MCP_CONNECT_URL_INTRO="You enter this address in your AI assistant application (the client). It is the same for every client."
COM_DHARMA_MCP_CONNECT_CHECKS="Self-check"
COM_DHARMA_MCP_CHECK_MCP="The server answers at this address"
COM_DHARMA_MCP_CHECK_MCP_404="The address does not reach Joomla. If the site runs on nginx, add the rules from the guide (docs/INSTALL.md, section on hosting). Meanwhile you can use an address like …/index.php/mcp."
COM_DHARMA_MCP_CHECK_MCP_403="The server refused (403). Check that the site is opened over HTTPS and the Require HTTPS setting in Components → Dharma MCP → Settings."
COM_DHARMA_MCP_CHECK_MCP_OTHER="The answer does not look like an MCP server. Check that the system plugin Dharma MCP (addresses) is enabled and the server is not switched off in the settings."
COM_DHARMA_MCP_CHECK_UNREACHABLE="The site could not call itself (common on hosting). This is not necessarily an error: test the address from your computer with the command in section 3."
COM_DHARMA_MCP_CHECK_OAUTH="OAuth settings are available (for Claude Desktop, claude.ai, ChatGPT)"
COM_DHARMA_MCP_CHECK_OAUTH_HINT="They are needed to connect without a token. If unavailable, connect clients with a token; for OAuth enable the system plugin Dharma MCP (addresses) and add the web server rules from the guide (nginx)."
COM_DHARMA_MCP_CONNECT_STEP_TOKEN="2. Access token"
COM_DHARMA_MCP_CONNECT_TOKEN_INTRO="A token is a password for the assistant. Create one: choose a Joomla user and the minimum scopes (read is enough at first). Right after saving, Joomla shows the token once: copy it. Claude Desktop, claude.ai and ChatGPT do not ask for a token: they sign in through your Joomla account."
COM_DHARMA_MCP_CONNECT_CREATE_TOKEN="Create a token"
COM_DHARMA_MCP_CONNECT_ALL_TOKENS="All tokens"
COM_DHARMA_MCP_CONNECT_STEP_CLIENT="3. Connect the assistant application"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE="Claude Code (terminal): with a token"
COM_DHARMA_MCP_CONNECT_CLAUDE_CODE_DESC="Run the command in a terminal, replacing ВАШ_ТОКЕН with your token."
COM_DHARMA_MCP_CONNECT_DESKTOP="Claude Desktop, claude.ai, ChatGPT: without a token"
COM_DHARMA_MCP_CONNECT_DESKTOP_DESC="In the application settings find Connectors, add a custom connector and paste the address from step 1. A page of your site opens: sign in and press Allow. This needs the setting Allow sign-in with OAuth and a passing OAuth check above. Button names in the clients change; check their documentation."
