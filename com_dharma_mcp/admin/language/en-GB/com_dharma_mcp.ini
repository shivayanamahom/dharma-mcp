COM_DHARMA_MCP="Dharma MCP"
COM_DHARMA_MCP_XML_DESCRIPTION="Connects an AI assistant (Claude, ChatGPT and others) to a Joomla site: shop, articles, menus, modules, template and settings. Everything runs with your Joomla permissions and is written to a log."
