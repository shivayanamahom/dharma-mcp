COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION="Allow client registration"
COM_DHARMA_MCP_CONFIG_OAUTH_REGISTRATION_DESC="MCP clients register themselves (standard RFC 7591). When off, no new client can connect through OAuth; existing grants keep working."
