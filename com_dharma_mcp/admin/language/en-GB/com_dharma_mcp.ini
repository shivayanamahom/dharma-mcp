COM_DHARMA_MCP_TOKEN_EDIT="Edit token"
COM_DHARMA_MCP_TOKEN_TITLE="Token name"
COM_DHARMA_MCP_TOKEN_TITLE_DESC="For example: Claude Desktop, ChatGPT, reporting script."
COM_DHARMA_MCP_TOKEN_USER="Joomla user"
COM_DHARMA_MCP_TOKEN_USER_DESC="All actions run as this user and are checked against their Joomla permissions. A token can never do more than the user."
COM_DHARMA_MCP_TOKEN_PREFIX="Prefix"
COM_DHARMA_MCP_TOKEN_SCOPES="Access areas"
COM_DHARMA_MCP_TOKEN_SCOPES_DESC="What this token may do. Grant the minimum: read for reports, write only for trusted assistants. The Template and System areas are for developers."
COM_DHARMA_MCP_TOKEN_EXPIRES="Expires"
COM_DHARMA_MCP_TOKEN_EXPIRES_DESC="Leave empty if the token should never expire. For the Template and System areas a short lifetime is better."
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS="Allowed IP addresses"
COM_DHARMA_MCP_TOKEN_ALLOWED_IPS_DESC="Optional. Addresses or networks (for example 10.0.0.0/8), separated by commas or new lines. If empty, the token works from any address. Cloud applications (Claude, ChatGPT) have no fixed address, so leave this empty for them."
COM_DHARMA_MCP_TOKEN_LAST_USED="Last used"
COM_DHARMA_MCP_TOKEN_REQUESTS="Requests"
COM_DHARMA_MCP_RAW_TOKEN_NOTICE="Save the token now: it will not be shown again. Paste it into your assistant application:"
COM_DHARMA_MCP_TOKEN_COPIED="Token copied to the clipboard"

