PLG_SYSTEM_DHARMAMCP="Система — Dharma MCP (адреса)"
PLG_SYSTEM_DHARMAMCP_XML_DESCRIPTION="Открывает MCP-сервер и вход OAuth по коротким адресам (/mcp, /oauth/token, /.well-known/…). Нужен для подключения Claude и ChatGPT. Короткие адреса работают при включённой «Перезаписи URL» в общих настройках; без неё сервер доступен по адресу /index.php/mcp."
