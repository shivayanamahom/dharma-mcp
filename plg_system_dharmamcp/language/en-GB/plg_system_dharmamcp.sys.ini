PLG_SYSTEM_DHARMAMCP_XML_DESCRIPTION="Serves the MCP server and OAuth sign-in at short addresses (/mcp, /oauth/token, /.well-known/…). Needed to connect Claude and ChatGPT. Short addresses work when “Use URL Rewriting” is on in the global settings; without it the server is at /index.php/mcp."
