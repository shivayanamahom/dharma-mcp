PKG_DHARMA_MCP="Dharma MCP (package)"
PKG_DHARMA_MCP_XML_DESCRIPTION="Connects an AI assistant to a Joomla site. The package contains the core and the Shop, Articles and menus, Template and System packs. Template and System are disabled: enable them under Plugins (group dharmamcp) if the assistant needs access to files and settings. Then open Components → Dharma MCP → Connect."
