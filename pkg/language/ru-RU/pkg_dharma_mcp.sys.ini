PKG_DHARMA_MCP_XML_DESCRIPTION="MCP-сервер для сайта на Joomla: ядро, наборы инструментов «Магазин», «Материалы и меню», «Шаблон» и «Система». Наборы «Шаблон» и «Система» выключены: включите их в Плагины (группа dharmamcp), если нужен доступ к файлам и настройкам."
