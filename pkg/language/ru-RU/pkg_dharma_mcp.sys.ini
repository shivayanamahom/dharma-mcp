PKG_DHARMA_MCP="Dharma MCP (пакет)"
PKG_DHARMA_MCP_XML_DESCRIPTION="Подключает ИИ-ассистента к сайту на Joomla. В пакете: ядро и наборы «Магазин», «Материалы и меню», «Шаблон» и «Система». «Шаблон» и «Система» выключены: включите их в Плагинах (группа dharmamcp), если ассистенту нужен доступ к файлам и настройкам. Дальше откройте Компоненты → Dharma MCP → Подключение."
